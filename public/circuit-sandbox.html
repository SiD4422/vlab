<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual EMI Bench — Circuit Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f8fafc; --panel2:#e2e8f0; --border:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --accent:#0d9488; --accent-dim:#ccfbf1;
    --warn:#d97706; --danger:#e11d48; --mono:'IBM Plex Mono',monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;overflow:hidden;}
  button{font-family:var(--sans);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;transition:.15s;}
  button:hover{border-color:var(--accent);color:var(--accent);}
  button.primary{background:var(--accent);color:#04201d;border-color:var(--accent);}
  button.primary:hover{opacity:.88;color:#04201d;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:13px;}
  input[type=number]:focus{outline:1px solid var(--accent);}

  .app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
  .topbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel);}
  .brand{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--accent);white-space:nowrap;}
  .topbar .sep{width:1px;height:26px;background:var(--border);margin:0 4px;}
  .topbar .spacer{flex:1;}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .body{display:grid;grid-template-columns:200px 1fr 260px;min-height:0;}
  .palette{border-right:1px solid var(--border);background:var(--panel);padding:14px 10px;overflow-y:auto;}
  .palette h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 6px 10px;}
  .pitem{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;}
  .pitem:hover{background:var(--panel);border-color:var(--border);}
  .pitem.armed{background:var(--accent-dim);border-color:var(--accent);}
  .pitem svg{width:34px;height:22px;flex-shrink:0;}
  .pitem span{font-size:12.5px;font-weight:500;}

  .canvas-wrap{position:relative;overflow:auto;background:
      linear-gradient(90deg, var(--panel2) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(var(--panel2) 1px, transparent 1px) 0 0/40px 40px, var(--bg);}
  svg#canvas{display:block;cursor:default;}
  .comp-body{cursor:grab;}
  .comp-body:active{cursor:grabbing;}
  .comp-body.selected .body-outline{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 4;fill:rgba(13,148,136,0.05);}
  .ctx-btn{cursor:pointer;}
  .ctx-btn circle{transition:0.15s;fill:var(--panel);}
  .ctx-btn:hover circle{fill:var(--panel2);}
  .terminal{fill:var(--muted);stroke:var(--bg);stroke-width:1.5;cursor:crosshair;}
  .terminal:hover{fill:var(--accent);}
  .lead{stroke:var(--muted);stroke-width:2.5;fill:none;}
  .icon-line{stroke:var(--text);stroke-width:2.2;fill:none;stroke-linecap:round;}
  .label-name{fill:var(--muted);font-family:var(--mono);font-size:10.5px;text-anchor:middle;}
  .label-val{fill:var(--text);font-family:var(--mono);font-size:10.5px;text-anchor:middle;font-weight:600;}
  .label-read{fill:var(--accent);font-family:var(--mono);font-size:11px;text-anchor:middle;font-weight:700;}
  .wire{stroke:var(--muted);stroke-width:3;fill:none;cursor:pointer;}
  .wire:hover{stroke:var(--accent);}
  .wire.selected{stroke:var(--accent);stroke-width:3.5;}
  .wire-draft{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none;pointer-events:none;}
  .meter-ring{fill:var(--panel2);}
  .meter-text{fill:var(--accent);font-family:var(--mono);font-weight:700;font-size:12px;text-anchor:middle;}

  .inspector{border-left:1px solid var(--border);background:var(--panel);padding:16px;overflow-y:auto;}
  .inspector h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .insp-empty{color:var(--muted);font-size:13px;line-height:1.6;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .readout-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
  .readout{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
  .readout .k{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .readout .v{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);}
  .insp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .insp-title{font-size:15px;font-weight:700;margin-bottom:4px;}
  .insp-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">⚡ CIRCUIT SANDBOX</div>
    <div class="sep"></div>
    <button id="btnRun" class="primary">⏸ Pause</button>
    <button id="btnClear">🗑 Clear</button>
    <button id="btnFullscreen">⛶ Fullscreen</button>

    <button id="btnSave">💾 Save</button>
    <button id="btnLoad">📂 Load</button>
    <div class="spacer"></div>
    <div class="hint" id="hint">Click a component from the left panel to select it, then click on the grid to place it.</div>
  </div>
  <div class="body">
    <div class="palette" id="palette"></div>
    <div class="canvas-wrap">
      <svg id="canvas" width="1600" height="1100"></svg>
    </div>
    <div class="inspector" id="inspector"></div>
  </div>
</div>

<script>
const GMIN = 1e-9;
class DSU{
  constructor(){ this.parent = new Map(); }
  find(x){ if(!this.parent.has(x)) this.parent.set(x,x);
    let root=x; while(this.parent.get(root)!==root) root=this.parent.get(root);
    let cur=x; while(this.parent.get(cur)!==root){ const nx=this.parent.get(cur); this.parent.set(cur,root); cur=nx; }
    return root; }
  union(a,b){ const ra=this.find(a), rb=this.find(b); if(ra!==rb) this.parent.set(ra,rb); }
}
const REF = (compId,t)=> compId+'#'+t;
const GND = '__GND__';

function buildDSU(components, wires){
  const dsu = new DSU(); dsu.find(GND);
  wires.forEach(w=> dsu.union(REF(w.a.compId,w.a.t), REF(w.b.compId,w.b.t)));
  components.forEach(c=>{
    if(c.type==='switch' && c.on) dsu.union(REF(c.id,0), REF(c.id,1));
    if(c.type==='ground') dsu.union(REF(c.id,0), GND);
  });
  return dsu;
}

function solveCircuit(components, wires, dt, t, history){
  history = history || {};
  const dsu = buildDSU(components, wires);
  const root = (compId,tIdx)=> dsu.find(REF(compId,tIdx));
  const nodeSet = new Set();
  components.forEach(c=>{ if(c.type==='ground') return; for(let i=0;i<2;i++) nodeSet.add(root(c.id,i)); });
  const gndRoot = dsu.find(GND); nodeSet.add(gndRoot);
  const nodeList = [...nodeSet].filter(n=>n!==gndRoot);
  const nIndex = new Map(nodeList.map((n,i)=>[n,i]));
  const N = nodeList.length;
  const vSources = components.filter(c=> c.type==='battery' || c.type==='acsource');
  const M = vSources.length, size = N+M;
  const A = Array.from({length:size},()=>new Array(size).fill(0));
  const z = new Array(size).fill(0);
  const vidx = (r)=> r===gndRoot ? -1 : nIndex.get(r);
  for(let i=0;i<N;i++) A[i][i]+=GMIN;
  function stampG(nA,nB,G){ const a=vidx(nA), b=vidx(nB);
    if(a>=0) A[a][a]+=G; if(b>=0) A[b][b]+=G;
    if(a>=0&&b>=0){ A[a][b]-=G; A[b][a]-=G; } }
  function stampI(nA,nB,I){ const a=vidx(nA), b=vidx(nB); if(a>=0) z[a]+=I; if(b>=0) z[b]-=I; }

  components.forEach(c=>{
    if(c.type==='ground' || c.type==='switch') return;
    const n1=root(c.id,0), n2=root(c.id,1);
    switch(c.type){
      case 'resistor': case 'bulb': stampG(n1,n2, 1/Math.max(c.value,1e-6)); break;
      case 'voltmeter': stampG(n1,n2, 1/10e6); break;
      case 'ammeter': stampG(n1,n2, 1/0.001); break;
      case 'galvanometer': stampG(n1,n2, 1/(c.value||100)); break;
      case 'capacitor': { const G=Math.max(c.value,1e-12)/dt; const vPrev=history[c.id]||0; stampG(n1,n2,G); stampI(n1,n2,G*vPrev); break; }
      case 'inductor': { const G=dt/Math.max(c.value,1e-9); const iPrev=history[c.id]||0; stampG(n1,n2,G); stampI(n2,n1,iPrev); break; }
      default: break;
    }
  });
  vSources.forEach((c,k)=>{
    const n1=root(c.id,0), n2=root(c.id,1), row=N+k;
    const a=vidx(n1), b=vidx(n2);
    if(a>=0){ A[a][row]+=1; A[row][a]+=1; }
    if(b>=0){ A[b][row]-=1; A[row][b]-=1; }
    z[row] = (c.type==='acsource') ? c.value*Math.sin(2*Math.PI*(c.freq||2)*t) : c.value;
  });
  const x = gaussSolve(A,z);
  if(!x) return null;
  const V = (r)=> r===gndRoot?0:x[nIndex.get(r)];
  const readings = {}, newHistory = {};
  components.forEach(c=>{
    if(c.type==='ground'){ readings[c.id]={}; return; }
    if(c.type==='switch'){ readings[c.id]={on:c.on}; return; }
    const n1=root(c.id,0), n2=root(c.id,1); const Vd=V(n1)-V(n2);
    switch(c.type){
      case 'resistor': case 'bulb': { const Rv=Math.max(c.value,1e-6); const I=Vd/Rv; readings[c.id]={V:Vd,I,P:Vd*I}; break; }
      case 'voltmeter': readings[c.id]={V:Vd}; break;
      case 'ammeter': readings[c.id]={I:Vd/0.001}; break;
      case 'galvanometer': readings[c.id]={I:Vd/(c.value||100), V:Vd}; break;
      case 'capacitor': { const G=Math.max(c.value,1e-12)/dt; const vPrev=history[c.id]||0; readings[c.id]={V:Vd,I:G*Vd-G*vPrev}; newHistory[c.id]=Vd; break; }
      case 'inductor': { const G=dt/Math.max(c.value,1e-9); const iPrev=history[c.id]||0; const I=G*Vd+iPrev; readings[c.id]={V:Vd,I}; newHistory[c.id]=I; break; }
      case 'battery': case 'acsource': { const k=vSources.indexOf(c); readings[c.id]={V:Vd, I:x[N+k]}; break; }
      default: break;
    }
  });
  return {readings, history:newHistory};
}

function gaussSolve(Ain,zin){
  const n=zin.length; const A=Ain.map(r=>r.slice()), z=zin.slice();
  for(let col=0; col<n; col++){
    let piv=col;
    for(let r=col+1;r<n;r++) if(Math.abs(A[r][col])>Math.abs(A[piv][col])) piv=r;
    if(Math.abs(A[piv][col])<1e-14) continue;
    if(piv!==col){ [A[col],A[piv]]=[A[piv],A[col]]; [z[col],z[piv]]=[z[piv],z[col]]; }
    const pv=A[col][col];
    for(let r=0;r<n;r++){ if(r===col) continue; const f=A[r][col]/pv; if(f===0) continue;
      for(let cc=col; cc<n; cc++) A[r][cc]-=f*A[col][cc]; z[r]-=f*z[col]; }
  }
  const x=new Array(n).fill(0);
  for(let i=0;i<n;i++) x[i]=Math.abs(A[i][i])<1e-14?0:z[i]/A[i][i];
  return x;
}

const GRID = 40;
const COMP_TYPES = {
  resistor:     {label:'Resistor',      unit:'Ω',  def:100,  terms:2},
  bulb:         {label:'Bulb',          unit:'Ω',  def:20,   terms:2},
  capacitor:    {label:'Capacitor',     unit:'µF', def:100,  terms:2},
  inductor:     {label:'Inductor',      unit:'mH', def:100,  terms:2},
  switch:       {label:'Switch',        unit:'',   def:null, terms:2},
  voltmeter:    {label:'Voltmeter',     unit:'',   def:null, terms:2},
  ammeter:      {label:'Ammeter',       unit:'',   def:null, terms:2},
  galvanometer: {label:'Galvanometer',  unit:'Ω',  def:100,  terms:2},
  battery:      {label:'Battery (DC)',  unit:'V',  def:9,    terms:2},
  acsource:     {label:'AC Source',     unit:'V',  def:10,   terms:2, extra:{key:'freq',label:'Frequency',unit:'Hz',def:2}},
  ground:       {label:'Ground',        unit:'',   def:null, terms:1},
};

function localTerminals(type){
  if(type==='ground') return [{dx:0,dy:-28}];
  return [{dx:-40,dy:0},{dx:40,dy:0}];
}
function rotatePt(dx,dy,deg){
  const rad = deg*Math.PI/180;
  return { x: dx*Math.cos(rad)-dy*Math.sin(rad), y: dx*Math.sin(rad)+dy*Math.cos(rad) };
}
function absTerminal(c, idx){
  const lt = localTerminals(c.type)[idx];
  const r = rotatePt(lt.dx, lt.dy, c.rotation||0);
  return { x: c.x+r.x, y: c.y+r.y };
}

function iconInner(c){
  switch(c.type){
    case 'resistor':
      return `<path class="lead" d="M-40,0 L-22,0"/><path class="lead" d="M22,0 L40,0"/>
              <path class="icon-line" d="M-22,0 L-14,0 L-10,-9 L-2,9 L6,-9 L14,9 L18,0 L22,0"/>`;
    case 'bulb': {
      const p = Math.min(1, (c._P||0)/2);
      return `<path class="lead" d="M-40,0 L-16,0"/><path class="lead" d="M16,0 L40,0"/>
              <circle cx="0" cy="0" r="16" fill="rgba(245,165,36,${0.12+0.7*p})" stroke="#f5a524" stroke-width="2"/>
              <path class="icon-line" stroke="#f5a524" d="M-9,-9 L9,9 M9,-9 L-9,9"/>`;
    }
    case 'capacitor':
      return `<path class="lead" d="M-40,0 L-6,0"/><path class="lead" d="M6,0 L40,0"/>
              <path class="icon-line" d="M-6,-14 L-6,14 M6,-14 L6,14"/>`;
    case 'inductor':
      return `<path class="lead" d="M-40,0 L-24,0"/><path class="lead" d="M24,0 L40,0"/>
              <path class="icon-line" d="M-24,0 Q-16,-16 -8,0 Q0,-16 8,0 Q16,-16 24,0"/>`;
    case 'switch': {
      const closed = !!c.on;
      return `<path class="lead" d="M-40,0 L-14,0"/><path class="lead" d="M14,0 L40,0"/>
              <circle cx="-14" cy="0" r="3.5" fill="var(--muted)"/><circle cx="14" cy="0" r="3.5" fill="var(--muted)"/>
              <path class="icon-line" stroke="${closed?'#2dd4c8':'#f5556e'}" d="M-14,0 L${closed?14:5},${closed?0:-16}"/>`;
    }
    case 'voltmeter':
      return `<path class="lead" d="M-40,0 L-18,0"/><path class="lead" d="M18,0 L40,0"/>
              <circle cx="0" cy="0" r="18" fill="var(--panel2)" stroke="var(--muted)" stroke-width="2"/>
              <text x="0" y="5" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" fill="var(--text)">V</text>`;
    case 'ammeter':
      return `<path class="lead" d="M-40,0 L-18,0"/><path class="lead" d="M18,0 L40,0"/>
              <circle cx="0" cy="0" r="18" fill="var(--panel2)" stroke="var(--muted)" stroke-width="2"/>
              <text x="0" y="5" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" fill="var(--text)">A</text>`;
    case 'galvanometer':
      return `<path class="lead" d="M-40,0 L-18,0"/><path class="lead" d="M18,0 L40,0"/>
              <circle cx="0" cy="0" r="18" fill="var(--panel2)" stroke="var(--muted)" stroke-width="2"/>
              <text x="0" y="13" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9" fill="var(--text)">G</text>
              <g data-needle="1"><line x1="0" y1="0" x2="0" y2="-13" stroke="#2dd4c8" stroke-width="2" stroke-linecap="round"/></g>`;
    case 'battery':
      return `<path class="lead" d="M-40,0 L-10,0"/><path class="lead" d="M10,0 L40,0"/>
              <path class="icon-line" d="M-10,-16 L-10,16"/><path class="icon-line" stroke-width="4" d="M-2,-9 L-2,9"/>
              <path class="icon-line" d="M2,-16 L2,16"/><path class="icon-line" stroke-width="4" d="M10,-9 L10,9"/>
              <text x="-22" y="-14" font-family="IBM Plex Mono" font-size="13" fill="#2dd4c8">+</text>`;
    case 'acsource':
      return `<path class="lead" d="M-40,0 L-18,0"/><path class="lead" d="M18,0 L40,0"/>
              <circle cx="0" cy="0" r="18" fill="var(--panel2)" stroke="var(--muted)" stroke-width="2"/>
              <path class="icon-line" d="M-9,2 Q-5,-9 0,2 Q5,13 9,2"/>`;
    case 'ground':
      return `<path class="lead" d="M0,-28 L0,-8"/>
              <path class="icon-line" d="M-14,-8 L14,-8"/>
              <path class="icon-line" d="M-8,-2 L8,-2"/>
              <path class="icon-line" d="M-3,4 L3,4"/>`;
    default: return '';
  }
}
function paletteIcon(type){
  return `<svg viewBox="-42 -22 84 44">${iconInner({type})}</svg>`;
}

let components = [];
let wires = [];
let simHistory = {};
let simTime = 0;
let running = true;
let selected = null;
let placing = null;
let drag = null;
let uidCounter = 1;
const uid = ()=> 'c'+(uidCounter++);

function addComponent(type, x, y){
  const def = COMP_TYPES[type];
  const c = { id: uid(), type, x, y, rotation:0, value: def.def };
  if(type==='switch') c.on = true;
  if(def.extra) c[def.extra.key] = def.extra.def;
  components.push(c);
  return c;
}
function removeComponent(id){
  components = components.filter(c=>c.id!==id);
  wires = wires.filter(w=> w.a.compId!==id && w.b.compId!==id);
  delete simHistory[id];
}
function addWire(a,b){
  if(a.compId===b.compId && a.t===b.t) return;
  wires.push({id:'w'+uid(), a, b});
}

const svg = document.getElementById('canvas');

function wirePath(w){
  const ca = components.find(c=>c.id===w.a.compId), cb = components.find(c=>c.id===w.b.compId);
  if(!ca||!cb) return '';
  const p1 = absTerminal(ca,w.a.t), p2 = absTerminal(cb,w.b.t);
  if(Math.abs(p1.x-p2.x)<1 || Math.abs(p1.y-p2.y)<1) return `M${p1.x},${p1.y} L${p2.x},${p2.y}`;
  return `M${p1.x},${p1.y} L${p2.x},${p1.y} L${p2.x},${p2.y}`;
}

function render(){
  let html = '';
  wires.forEach(w=>{
    html += `<path class="wire ${selected&&selected.kind==='wire'&&selected.id===w.id?'selected':''}" data-role="wire" data-id="${w.id}" d="${wirePath(w)}"/>`;
  });
  components.forEach(c=>{
    const def = COMP_TYPES[c.type];
    const terms = localTerminals(c.type);
    let termHtml = terms.map((lt,idx)=>{
      return `<circle class="terminal" data-role="terminal" data-comp="${c.id}" data-t="${idx}" cx="${lt.dx}" cy="${lt.dy}" r="6"/>`;
    }).join('');
    const isSel = selected && selected.kind==='comp' && selected.id===c.id;
    const valLabel = (def.def!==null) ? `${fmtVal(c.value)}${def.unit}` : '';
    html += `<g class="comp-body ${isSel?'selected':''}" data-role="body" data-comp="${c.id}"
                transform="translate(${c.x},${c.y}) rotate(${c.rotation||0})">
        <rect class="body-outline" x="-46" y="-24" width="92" height="48" rx="10" fill="transparent" stroke="transparent" pointer-events="all"/>
        ${iconInner(c)}
        ${termHtml}
      </g>
      <text class="label-name" x="${c.x}" y="${c.y-30}">${def.label}</text>
      ${valLabel?`<text class="label-val" x="${c.x}" y="${c.y+40}">${valLabel}</text>`:''}
      <text class="label-read" data-role="reading" data-comp="${c.id}" x="${c.x}" y="${c.y+54}"></text>
      ${isSel ? `
        <g class="ctx-btn" data-role="ctx-rotate" data-comp="${c.id}" transform="translate(${c.x-30},${c.y-40})">
          <circle cx="0" cy="0" r="14" stroke="var(--border)" stroke-width="1.5"/>
          <text x="0" y="4" font-size="14" fill="var(--text)" text-anchor="middle">↻</text>
        </g>
        <g class="ctx-btn" data-role="ctx-delete" data-comp="${c.id}" transform="translate(${c.x+30},${c.y-40})">
          <circle cx="0" cy="0" r="14" stroke="var(--danger)" stroke-width="1.5"/>
          <text x="0" y="4.5" font-size="13" fill="var(--danger)" text-anchor="middle">🗑</text>
        </g>
      ` : ''}
    `;
  });
  svg.innerHTML = html;
}
function fmtVal(v){
  if(v===null||v===undefined) return '';
  if(Math.abs(v)>=1000) return (v/1000).toFixed(v%1000===0?0:1)+'k';
  return (v%1===0)? String(v) : v.toFixed(2);
}

function renderPalette(){
  const groups = [
    ['Sources', ['battery','acsource','ground']],
    ['Passive', ['resistor','bulb','capacitor','inductor','switch']],
    ['Meters', ['voltmeter','ammeter','galvanometer']],
  ];
  let html='';
  groups.forEach(([title, types])=>{
    html += `<h4>${title}</h4>`;
    types.forEach(t=>{
      html += `<div class="pitem" data-type="${t}" id="pitem-${t}">${paletteIcon(t)}<span>${COMP_TYPES[t].label}</span></div>`;
    });
  });
  document.getElementById('palette').innerHTML = html;
  document.querySelectorAll('.pitem').forEach(el=>{
    el.addEventListener('click', ()=>{
      placing = (placing===el.dataset.type) ? null : el.dataset.type;
      document.querySelectorAll('.pitem').forEach(p=>p.classList.toggle('armed', p.dataset.type===placing));
      document.getElementById('hint').textContent = placing
        ? `Click anywhere on the grid to place a ${COMP_TYPES[placing].label}.`
        : 'Click a component from the left panel to select it, then click on the grid to place it.';
    });
  });
}

function renderInspector(){
  const el = document.getElementById('inspector');
  if(!selected){
    el.innerHTML = `<h4>Inspector</h4><div class="insp-empty">Select a component or wire to see its properties and live readings here.<br><br>
      <b>Tips</b><br>• Click a palette item, then click the grid to place it.<br>• Drag from a terminal dot to wire two parts.<br>• Click a part, press <b>R</b> to rotate, <b>Delete</b> to remove.<br>• Click a switch to flip it on/off.</div>`;
    return;
  }
  if(selected.kind==='wire'){
    el.innerHTML = `<h4>Inspector</h4><div class="insp-title">Wire</div><div class="insp-sub">Connects two terminals.</div>
      <div class="insp-actions"><button id="btnDelWire">🗑 Delete Wire</button></div>`;
    document.getElementById('btnDelWire').onclick=()=>{ wires = wires.filter(w=>w.id!==selected.id); selected=null; render(); renderInspector(); };
    return;
  }
  const c = components.find(x=>x.id===selected.id);
  if(!c){ selected=null; renderInspector(); return; }
  const def = COMP_TYPES[c.type];
  let fields = '';
  if(def.def!==null && c.type!=='switch'){
    fields += `<div class="field"><label>${def.label} value (${def.unit})</label><input type="number" id="fVal" value="${c.value}" step="any"></div>`;
  }
  if(def.extra){
    fields += `<div class="field"><label>${def.extra.label} (${def.extra.unit})</label><input type="number" id="fExtra" value="${c[def.extra.key]}" step="any"></div>`;
  }
  let switchBtn = '';
  if(c.type==='switch'){
    switchBtn = `<button id="btnToggleSw" style="width:100%;margin-bottom:10px;">${c.on?'🟢 ON — click to open':'🔴 OFF — click to close'}</button>`;
  }
  const readoutDefs = {
    resistor:['V','I','P'], bulb:['V','I','P'], capacitor:['V','I'], inductor:['V','I'],
    voltmeter:['V'], ammeter:['I'], galvanometer:['I','V'], battery:['V','I'], acsource:['V','I'], ground:[], switch:[]
  };
  const rk = readoutDefs[c.type]||[];
  const readoutHtml = rk.map(k=>`<div class="readout"><div class="k">${k==='V'?'Voltage (V)':k==='I'?'Current (A)':'Power (W)'}</div><div class="v" id="ro-${k}">--</div></div>`).join('');

  el.innerHTML = `<h4>Inspector</h4>
    <div class="insp-title">${def.label}</div>
    <div class="insp-sub">id: ${c.id}</div>
    ${switchBtn}
    ${fields}
    ${rk.length?`<div class="readout-grid">${readoutHtml}</div>`:''}
    <div class="insp-actions">
      <button id="btnRotate">↻ Rotate</button>
      <button id="btnDelete">🗑 Delete</button>
    </div>`;

  const fVal = document.getElementById('fVal');
  if(fVal) fVal.oninput = ()=>{ c.value = parseFloat(fVal.value)||0; render(); };
  const fExtra = document.getElementById('fExtra');
  if(fExtra) fExtra.oninput = ()=>{ c[def.extra.key] = parseFloat(fExtra.value)||0; };
  const btnSw = document.getElementById('btnToggleSw');
  if(btnSw) btnSw.onclick = ()=>{ c.on=!c.on; render(); renderInspector(); };
  document.getElementById('btnRotate').onclick = ()=>{ c.rotation = ((c.rotation||0)+90)%360; render(); };
  document.getElementById('btnDelete').onclick = ()=>{ removeComponent(c.id); selected=null; render(); renderInspector(); };
}

function svgPoint(evt){
  const rect = svg.getBoundingClientRect();
  return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
}
function snap(v){ return Math.round(v/GRID)*GRID; }

svg.addEventListener('pointerdown', (e)=>{
  const pt = svgPoint(e);
  const target = e.target;
  const ctxBtn = target.closest ? target.closest('.ctx-btn') : null;
  if(ctxBtn){
    const role = ctxBtn.dataset.role;
    const compId = ctxBtn.dataset.comp;
    if(role==='ctx-rotate'){
      const c = components.find(x=>x.id===compId);
      if(c){ c.rotation = ((c.rotation||0)+90)%360; render(); }
    } else if(role==='ctx-delete'){
      removeComponent(compId); selected=null; render(); renderInspector();
    }
    return;
  }
  if(placing){
    addComponent(placing, snap(pt.x), snap(pt.y));
    placing = null;
    document.querySelectorAll('.pitem').forEach(p=>p.classList.remove('armed'));
    document.getElementById('hint').textContent = 'Click a component from the left panel to select it, then click on the grid to place it.';
    render(); return;
  }
  if(target.dataset && target.dataset.role==='terminal'){
    drag = { mode:'wire', from:{compId:target.dataset.comp, t:parseInt(target.dataset.t)}, cur:pt }; return;
  }
  const compBody = target.closest ? target.closest('.comp-body') : null;
  if(compBody){
    const compId = compBody.dataset.comp;
    const c = components.find(x=>x.id===compId);
    if(c.type==='switch'){
      drag = { mode:'move-or-toggle', compId, startPt:pt, origin:{x:c.x,y:c.y}, moved:false };
    } else {
      drag = { mode:'move', compId, origin:{x:c.x,y:c.y}, startPt:pt };
    }
    selected = {kind:'comp', id:compId};
    render(); renderInspector(); return;
  }
  if(target.dataset && target.dataset.role==='wire'){
    selected = {kind:'wire', id:target.dataset.id};
    render(); renderInspector(); return;
  }
  selected = null; render(); renderInspector();
});

svg.addEventListener('pointermove', (e)=>{
  if(!drag) return;
  const pt = svgPoint(e);
  if(drag.mode==='move' || drag.mode==='move-or-toggle'){
    const dx = pt.x-drag.startPt.x, dy = pt.y-drag.startPt.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) drag.moved = true;
    const c = components.find(x=>x.id===drag.compId);
    c.x = snap(drag.origin.x+dx); c.y = snap(drag.origin.y+dy);
    render();
  } else if(drag.mode==='wire'){
    drag.cur = pt; drawWireDraft();
  }
});

svg.addEventListener('pointerup', (e)=>{
  if(!drag) return;
  const target = e.target;
  if(drag.mode==='wire'){
    if(target.dataset && target.dataset.role==='terminal'){
      addWire(drag.from, {compId:target.dataset.comp, t:parseInt(target.dataset.t)});
    }
    removeWireDraft(); render();
  }
  if(drag.mode==='move-or-toggle' && !drag.moved){
    const c = components.find(x=>x.id===drag.compId);
    if(c) { c.on = !c.on; }
    render(); renderInspector();
  }
  drag = null;
});
svg.addEventListener('pointerleave', ()=>{ if(drag && drag.mode==='wire'){ removeWireDraft(); drag=null; } });

function drawWireDraft(){
  removeWireDraft();
  const ca = components.find(c=>c.id===drag.from.compId);
  const p1 = absTerminal(ca, drag.from.t);
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','wire-draft'); path.setAttribute('id','wireDraft');
  path.setAttribute('d', `M${p1.x},${p1.y} L${drag.cur.x},${drag.cur.y}`);
  svg.appendChild(path);
}
function removeWireDraft(){ const d=document.getElementById('wireDraft'); if(d) d.remove(); }

window.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ if(drag){ removeWireDraft(); drag=null; } placing=null; document.querySelectorAll('.pitem').forEach(p=>p.classList.remove('armed')); }
  if(!selected || selected.kind!=='comp') return;
  const c = components.find(x=>x.id===selected.id);
  if(!c) return;
  if(e.key==='r'||e.key==='R'){ c.rotation=((c.rotation||0)+90)%360; render(); }
  if(e.key==='Delete'||e.key==='Backspace'){ removeComponent(c.id); selected=null; render(); renderInspector(); }
});

const PHYS_DT = 0.002;
let lastFrame = performance.now();

function solverComponents(){
  return components.map(c=>{
    const o = Object.assign({}, c);
    if(c.type==='capacitor') o.value = c.value*1e-6;
    if(c.type==='inductor') o.value = c.value*1e-3;
    return o;
  });
}

function tick(now){
  requestAnimationFrame(tick);
  const elapsed = Math.min(0.1, (now-lastFrame)/1000);
  lastFrame = now;
  if(!running) return;
  const steps = Math.min(25, Math.max(1, Math.round(elapsed/PHYS_DT)));
  let res = null;
  const comps = solverComponents();
  for(let i=0;i<steps;i++){
    res = solveCircuit(comps, wires, PHYS_DT, simTime, simHistory);
    if(!res) break;
    simHistory = res.history;
    simTime += PHYS_DT;
  }
  if(res) applyReadings(res.readings);
}

function applyReadings(readings){
  components.forEach(c=>{
    const r = readings[c.id]; if(!r) return;
    const txt = svg.querySelector(`[data-role="reading"][data-comp="${c.id}"]`);
    if(txt){
      if(c.type==='resistor') txt.textContent = `${fmtSI(r.I,'A')}`;
      else if(c.type==='bulb'){ txt.textContent = `${fmtSI(r.I,'A')} · ${r.P.toFixed(2)}W`; c._P=r.P; }
      else if(c.type==='capacitor'||c.type==='inductor') txt.textContent = `${r.V.toFixed(2)}V · ${fmtSI(r.I,'A')}`;
      else if(c.type==='voltmeter') txt.textContent = `${r.V.toFixed(3)} V`;
      else if(c.type==='ammeter') txt.textContent = `${fmtSI(r.I,'A')}`;
      else if(c.type==='galvanometer') txt.textContent = `${fmtSI(r.I,'A')}`;
      else if(c.type==='battery'||c.type==='acsource') txt.textContent = `${fmtSI(r.I,'A')}`;
    }
    if(c.type==='bulb'){
      const glow = svg.querySelector(`[data-comp="${c.id}"] circle`);
      if(glow){ const p=Math.min(1,(r.P||0)/2); glow.setAttribute('fill', `rgba(245,165,36,${0.12+0.7*p})`); }
    }
    if(c.type==='galvanometer'){
      const needle = svg.querySelector(`[data-comp="${c.id}"] [data-needle] line`);
      if(needle){
        const deg = Math.max(-75, Math.min(75, (r.I||0)*3000));
        needle.setAttribute('transform', `rotate(${deg})`);
      }
    }
    if(selected && selected.kind==='comp' && selected.id===c.id){
      ['V','I','P'].forEach(k=>{
        const el = document.getElementById('ro-'+k);
        if(el && r[k]!==undefined) el.textContent = (k==='P'? r[k].toFixed(3) : fmtSI(r[k], k==='V'?'V':'A'));
      });
    }
  });
}

function fmtSI(v, unit){
  const a = Math.abs(v);
  if(a>=1) return v.toFixed(3)+' '+unit;
  if(a>=1e-3) return (v*1e3).toFixed(2)+' m'+unit;
  if(a>=1e-6) return (v*1e6).toFixed(2)+' µ'+unit;
  return v.toExponential(2)+' '+unit;
}

document.getElementById('btnRun').onclick = (e)=>{
  running = !running;
  e.target.textContent = running ? '⏸ Pause' : '▶ Run';
};
document.getElementById('btnClear').onclick = ()=>{
  if(!confirm('Clear the whole canvas?')) return;
  components=[]; wires=[]; simHistory={}; simTime=0; selected=null;
  render(); renderInspector();
};

document.getElementById('btnFullscreen').onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
};
document.addEventListener('fullscreenchange', () => {
  document.getElementById('btnFullscreen').textContent = document.fullscreenElement ? '🗗 Exit Fullscreen' : '⛶ Fullscreen';
});

document.getElementById('btnSave').onclick = ()=>{
  try {
    const data = JSON.stringify({ components, wires });
    localStorage.setItem('vlab_circuit_save', data);
    document.getElementById('hint').textContent = '✅ Circuit saved to browser storage.';
    setTimeout(()=>{ document.getElementById('hint').textContent = 'Click a component from the left panel to select it, then click on the grid to place it.'; }, 2000);
  } catch(e){ alert('Save failed.'); }
};
document.getElementById('btnLoad').onclick = ()=>{
  try {
    const raw = localStorage.getItem('vlab_circuit_save');
    if(!raw){ alert('No saved circuit found.'); return; }
    const data = JSON.parse(raw);
    components = data.components||[]; wires = data.wires||[]; simHistory={}; simTime=0; selected=null;
    render(); renderInspector();
    document.getElementById('hint').textContent = '✅ Circuit loaded.';
    setTimeout(()=>{ document.getElementById('hint').textContent = 'Click a component from the left panel to select it, then click on the grid to place it.'; }, 2000);
  } catch(e){ alert('Load failed or no saved data.'); }
};

function loadExample(comps, ws){
  components = comps; wires = ws; simHistory={}; simTime=0; selected=null;
  render(); renderInspector();
}


renderPalette();
render();
renderInspector();

requestAnimationFrame(tick);
</script>
</body>
